# 배포 경로는 저장소 Variable SFTP_PATH. 없으면 /mcstatus.
# 포트는 저장소 Variable SFTP_PORT. 없으면 22.
# 그 경로가 없으면 그 경로만 만든다. 다른 경로는 만들거나 지우지 않는다.
# config.ini는 배포 때 만든다.
# SERVER_HOST는 Secret이다. SERVER_PORT, SERVER_NAME, SERVER_TIMEOUT은 Variable이다.
# 없으면 포트 25565, 이름 "마인크래프트 서버", 타임아웃 3.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit "$status"

  deploy:
    name: Deploy SFTP
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sftp-${{ vars.SFTP_PATH || '/mcstatus' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Write config.ini
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_NAME: ${{ vars.SERVER_NAME }}
          SERVER_TIMEOUT: ${{ vars.SERVER_TIMEOUT }}
        run: |
          php <<'PHP'
          <?php
          $host = getenv('SERVER_HOST');
          $port = getenv('SERVER_PORT');
          $name = getenv('SERVER_NAME');
          $timeout = getenv('SERVER_TIMEOUT');
          $host = ($host === false || $host === '') ? '' : $host;
          $port = ($port === false || $port === '') ? '25565' : $port;
          $name = ($name === false || $name === '') ? '마인크래프트 서버' : $name;
          $timeout = ($timeout === false || $timeout === '') ? '3' : $timeout;

          if ($host === '') {
              fwrite(STDERR, "SERVER_HOST secret is empty\n");
              exit(1);
          }
          if (!preg_match('/^\d+$/', $port) || (int) $port < 1 || (int) $port > 65535) {
              fwrite(STDERR, "SERVER_PORT must be an integer from 1 to 65535\n");
              exit(1);
          }
          if (!preg_match('/^\d+(\.\d+)?$/', $timeout) || (float) $timeout <= 0) {
              fwrite(STDERR, "SERVER_TIMEOUT must be a positive number\n");
              exit(1);
          }
          if (preg_match("/[\r\n]/", $host . $name) === 1) {
              fwrite(STDERR, "SERVER_HOST and SERVER_NAME must be single line\n");
              exit(1);
          }

          $quote = static function (string $value): string {
              return '"' . str_replace(['\\', '"'], ['\\\\', '\\"'], $value) . '"';
          };
          $ini = "server_host = {$quote($host)}\n"
              . "server_port = {$port}\n"
              . "server_name = {$quote($name)}\n"
              . "timeout = {$timeout}\n";
          if (file_put_contents('config.ini', $ini) === false) {
              fwrite(STDERR, "failed to write config.ini\n");
              exit(1);
          }
          PHP

      - name: Upload via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ vars.SFTP_PORT || '22' }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          forceSSL: false
          verifyCertificate: false
          onlyNewer: false
          restoreMTime: false
          settings: sftp:auto-confirm=yes
          localDir: .
          remoteDir: ${{ vars.SFTP_PATH || '/mcstatus' }}
          reverse: true
          ignoreFile: .lftp_ignore
          options: --delete --verbose
