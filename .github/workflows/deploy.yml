# 배포 경로는 저장소 Variable SFTP_PATH. 없으면 /mcstatus.
# 포트는 저장소 Variable SFTP_PORT. 없으면 22.
# 그 경로가 없으면 그 경로만 만든다. 다른 경로는 만들거나 지우지 않는다.
# config.ini는 그 디렉터리 안에 있어도 업로드하지 않고 지우지 않는다.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit "$status"

  deploy:
    name: Deploy SFTP
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sftp-${{ vars.SFTP_PATH || '/mcstatus' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Upload via SFTP
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ vars.SFTP_PORT || '22' }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          forceSSL: false
          verifyCertificate: false
          onlyNewer: false
          restoreMTime: false
          settings: sftp:auto-confirm=yes
          localDir: .
          remoteDir: ${{ vars.SFTP_PATH || '/mcstatus' }}
          reverse: true
          ignoreFile: .lftp_ignore
          options: --delete --verbose
