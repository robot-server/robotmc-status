# 배포 경로는 저장소 Variable SFTP_PATH. 없으면 /mcstatus.
# 포트는 저장소 Variable SFTP_PORT. 없으면 22.
# 그 경로가 없으면 그 경로만 만든다. 다른 경로는 만들거나 지우지 않는다.
# 같은 경로의 배포는 한 번에 하나만 진행하고, 진행 중인 업로드는 끊지 않는다.
# 대기 중인 배포는 나중에 도착한 작업이 취소하지 못한다.
# 업로드 직전에 이 실행의 브랜치 HEAD와 SHA를 비교하고, 다르면 업로드하지 않는다.
# SFTP_HOST_KEY는 Secret이다. known_hosts에 넣을 공개키이며 "ssh-ed25519 AAAA..." 형식이다. 호스트 이름은 빼 둔다.
# config.ini는 배포 때 만든다.
# .htaccess는 config.ini의 HTTP 접근을 막는다. 배포에 포함한다.
# SERVER_HOST는 Secret이다. SERVER_PORT, SERVER_NAME, SERVER_TIMEOUT은 Variable이다.
# 없으면 포트 25565, 이름 "마인크래프트 서버", 타임아웃 3.
# DB_HOST, DB_NAME, DB_USER, DB_PASSWORD, COLLECT_TOKEN은 Secret이다. 비어 있으면 이 단계가 실패한다.
# DB_PORT는 Variable이다. 없으면 3306.

name: deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: PHP 8.3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Lint PHP
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' file; do
            php -l "$file" || status=1
          done < <(find . -name '*.php' -not -path './vendor/*' -print0)
          exit "$status"

  deploy:
    name: Deploy SFTP
    needs: check
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: sftp-${{ vars.SFTP_PATH || '/mcstatus' }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Write config.ini
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          SERVER_NAME: ${{ vars.SERVER_NAME }}
          SERVER_TIMEOUT: ${{ vars.SERVER_TIMEOUT }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          COLLECT_TOKEN: ${{ secrets.COLLECT_TOKEN }}
        run: |
          php <<'PHP'
          <?php
          $host = getenv('SERVER_HOST');
          $port = getenv('SERVER_PORT');
          $name = getenv('SERVER_NAME');
          $timeout = getenv('SERVER_TIMEOUT');
          $host = ($host === false || $host === '') ? '' : $host;
          $port = ($port === false || $port === '') ? '25565' : $port;
          $name = ($name === false || $name === '') ? '마인크래프트 서버' : $name;
          $timeout = ($timeout === false || $timeout === '') ? '3' : $timeout;

          if ($host === '') {
              fwrite(STDERR, "SERVER_HOST secret is empty\n");
              exit(1);
          }
          if (!preg_match('/^\d+$/', $port) || (int) $port < 1 || (int) $port > 65535) {
              fwrite(STDERR, "SERVER_PORT must be an integer from 1 to 65535\n");
              exit(1);
          }
          if (!preg_match('/^\d+(\.\d+)?$/', $timeout) || (float) $timeout <= 0) {
              fwrite(STDERR, "SERVER_TIMEOUT must be a positive number\n");
              exit(1);
          }
          $blank = static function (string|false $value): string {
              return $value === false ? '' : $value;
          };
          $dbHost = $blank(getenv('DB_HOST'));
          $dbPort = $blank(getenv('DB_PORT'));
          $dbName = $blank(getenv('DB_NAME'));
          $dbUser = $blank(getenv('DB_USER'));
          $dbPassword = $blank(getenv('DB_PASSWORD'));
          $collectToken = $blank(getenv('COLLECT_TOKEN'));
          if ($dbPort === '') {
              $dbPort = '3306';
          }
          foreach ([
              'DB_HOST' => $dbHost,
              'DB_NAME' => $dbName,
              'DB_USER' => $dbUser,
              'DB_PASSWORD' => $dbPassword,
              'COLLECT_TOKEN' => $collectToken,
          ] as $key => $value) {
              if ($value === '') {
                  fwrite(STDERR, $key . " secret is empty\n");
                  exit(1);
              }
          }
          if (!preg_match('/^\d+$/', $dbPort) || (int) $dbPort < 1 || (int) $dbPort > 65535) {
              fwrite(STDERR, "DB_PORT must be an integer from 1 to 65535\n");
              exit(1);
          }
          if (preg_match("/[\r\n]/", $host . $name . $dbHost . $dbName . $dbUser . $dbPassword . $collectToken) === 1) {
              fwrite(STDERR, "config values must be single line\n");
              exit(1);
          }

          require 'lib/config.php';
          $quote = static function (string $value): string {
              return config_quote($value);
          };
          $ini = "server_host = {$quote($host)}\n"
              . "server_port = {$port}\n"
              . "server_name = {$quote($name)}\n"
              . "timeout = {$timeout}\n"
              . "db_host = {$quote($dbHost)}\n"
              . "db_port = {$dbPort}\n"
              . "db_name = {$quote($dbName)}\n"
              . "db_user = {$quote($dbUser)}\n"
              . "db_password = {$quote($dbPassword)}\n"
              . "collect_token = {$quote($collectToken)}\n";
          if (file_put_contents('config.ini', $ini) === false) {
              fwrite(STDERR, "failed to write config.ini\n");
              exit(1);
          }
          PHP

      - name: Check branch HEAD
        id: head
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          head="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
          if [ "$head" = "${{ github.sha }}" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "Skip upload. origin/${BRANCH} is ${head}; this run is ${{ github.sha }}."
          fi

      - name: Require SFTP host key
        if: steps.head.outputs.current == 'true'
        env:
          SFTP_HOST_KEY: ${{ secrets.SFTP_HOST_KEY }}
        run: |
          if [ -z "${SFTP_HOST_KEY}" ]; then
            echo "SFTP_HOST_KEY secret is empty. Set the server public key without the host name, for example: ssh-ed25519 AAAA..."
            exit 1
          fi

      - name: Upload via SFTP
        if: steps.head.outputs.current == 'true'
        uses: pressidium/lftp-mirror-action@v1
        with:
          host: ${{ secrets.SFTP_HOST }}
          port: ${{ vars.SFTP_PORT || '22' }}
          user: ${{ secrets.SFTP_USER }}
          pass: ${{ secrets.SFTP_PASSWORD }}
          fingerprint: ${{ secrets.SFTP_HOST_KEY }}
          forceSSL: false
          verifyCertificate: false
          onlyNewer: false
          restoreMTime: false
          localDir: .
          remoteDir: ${{ vars.SFTP_PATH || '/mcstatus' }}
          reverse: true
          ignoreFile: .lftp_ignore
          options: --delete --verbose
